name: Organizar documentacao Saga

on:
  push:
    paths:
      - .github/workflows/organizar-repositorio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Extrair e validar documentacao
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import zipfile
          import stat

          arquivo = Path("documentação.zip")
          if not arquivo.is_file():
              raise SystemExit("Arquivo documentação.zip não encontrado.")

          arquivos = {}
          with zipfile.ZipFile(arquivo) as pacote:
              for entrada in pacote.infolist():
                  if entrada.is_dir():
                      continue
                  nome = PurePosixPath(entrada.filename)
                  if nome.is_absolute() or ".." in nome.parts:
                      raise SystemExit("Caminho inseguro no arquivo ZIP.")
                  if (entrada.external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                      raise SystemExit("Link simbólico não permitido no ZIP.")
                  partes = nome.parts
                  if partes and partes[0] == "saga-ecommerce-blueprint":
                      partes = partes[1:]
                  if not partes:
                      continue
                  relativo = PurePosixPath(*partes)
                  nome_final = relativo.as_posix()
                  autorizado = (
                      nome_final in {"README.md", ".gitignore"} or
                      (len(relativo.parts) == 2 and relativo.parts[0] == "docs" and relativo.suffix == ".md") or
                      (len(relativo.parts) == 2 and relativo.parts[0] == "diagrams" and relativo.suffix in {".png", ".svg", ".puml", ".mmd"})
                  )
                  if not autorizado or nome_final in arquivos or entrada.file_size > 10000000:
                      raise SystemExit(f"Arquivo inesperado ou duplicado: {nome_final}")
                  arquivos[nome_final] = pacote.read(entrada)

          essenciais = {
              "README.md",
              "docs/decisoes-arquiteturais.md",
              "diagrams/saga-architecture-overview.png",
              "diagrams/sequence-success-flow.png",
              "diagrams/sequence-compensation-flow.png",
          }
          if not essenciais.issubset(arquivos):
              raise SystemExit("Faltam arquivos obrigatórios do projeto.")
          if hashlib.sha256(arquivos["README.md"]).hexdigest() != "bf0bd075f5ea441993cc1357cbdd5bb0df964601400e152445d4e269e6c59fad":
              raise SystemExit("O ZIP enviado não corresponde ao README da versão revisada.")
          if hashlib.sha256(arquivos["docs/decisoes-arquiteturais.md"]).hexdigest() != "615b95bde8340461e17343d35c6f738fa6e1e1f4a51fe93ed2a58a8b55e8745c":
              raise SystemExit("O ZIP enviado não corresponde à documentação revisada.")
          for nome_final, dados in arquivos.items():
              destino = Path(nome_final)
              destino.parent.mkdir(parents=True, exist_ok=True)
              destino.write_bytes(dados)

          arquivo.unlink()
          Path(".github/workflows/organizar-repositorio.yml").unlink()
          print(f"Arquivos do projeto organizados: {len(arquivos)}")
          PY

      - name: Publicar arquivos organizados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Organiza documentacao e diagramas do projeto"
          git push
